<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" name="viewport">
  <title>{% block title %}Multitask face lab{% endblock %}</title>

  <!-- Favicon institucional con el icono cerebral del header -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/psychology.svg') }}">

  <!-- Tipografías institucionales Plus Jakarta Sans, JetBrains Mono y Material Symbols -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS con paleta Warm Scientific Minimalism -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          maxWidth: {
            "app": "1200px"
          },
          colors: {
            "surface-bright": "#faf9f7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3f0",
            "surface-container": "#efedea",
            "surface-container-high": "#e9e7e3",
            "surface-container-highest": "#e3e1dc",
            "surface": "#faf9f7",
            "on-surface": "#1c1a19",
            "on-surface-variant": "#5a504b",
            "primary": "#9f3c16",
            "primary-container": "#bf542c",
            "on-primary": "#ffffff",
            "secondary": "#5e5852",
            "tertiary": "#8a5824",
            "outline": "#8d817b",
            "outline-variant": "#ddd5cf"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #faf9f7;
      color: #1c1a19;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono-tag {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.2">
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary/10 selection:text-primary">

  <!-- Barra de navegación superior idéntica al mockup -->
  {% include "components/header.html" %}

  <!-- Contenedor central adaptado a app-container -->
  <main class="flex-1 app-container w-full max-w-[1200px] mx-auto px-4 sm:px-6 py-6 sm:py-10 md:py-12 space-y-8 sm:space-y-12">
    {% block content %}{% endblock %}
  </main>

  <!-- Pie de página con aviso académico estricto -->
  {% include "components/footer.html" %}

  <!-- Scripts con módulos nativos ES6 -->
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
