<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" name="viewport">
  <title>{% block title %}Multitask face lab{% endblock %}</title>

  <!-- Favicon institucional con el icono cerebral del header -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/psychology.svg') }}">

  <!-- Tipografías institucionales Plus Jakarta Sans, JetBrains Mono y Material Symbols -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS con paleta Warm Scientific Minimalism -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-bright": "#faf9f7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3f0",
            "surface-container": "#efedea",
            "surface-container-high": "#e9e7e3",
            "surface-container-highest": "#e3e1dc",
            "surface": "#faf9f7",
            "on-surface": "#1c1a19",
            "on-surface-variant": "#5a504b",
            "primary": "#9f3c16",
            "primary-container": "#bf542c",
            "on-primary": "#ffffff",
            "secondary": "#5e5852",
            "tertiary": "#8a5824",
            "outline": "#8d817b",
            "outline-variant": "#ddd5cf"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #faf9f7;
      color: #1c1a19;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono-tag {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary/10 selection:text-primary">

  <!-- Barra de navegación superior idéntica al mockup -->
  <header class="border-b border-outline-variant/60 bg-surface/90 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 h-18 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center border border-primary/20 shrink-0">
          <img src="{{ url_for('static', filename='icons/psychology.svg') }}" alt="Cerebro neuronal" class="w-5 h-5">
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-base font-semibold tracking-tight text-on-surface">Multitask face lab</span>
            <span class="text-[11px] font-mono-tag px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant">UCV</span>
          </div>
          <p class="text-xs text-on-surface-variant font-normal">Investigación en redes neuronales profundas</p>
        </div>
      </div>

      <!-- Estado de carga automática y botón para recargar modelos -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container-low border border-outline-variant/50 text-xs font-mono-tag text-on-surface-variant" id="model-status-indicator">
          <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse" id="status-pulse"></span>
          <span id="status-text">Modelos cargados automáticamente en memoria</span>
        </div>
        <button class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-surface-container-low hover:bg-surface-container border border-outline-variant/70 text-on-surface transition-all flex items-center gap-1.5 shadow-sm active:scale-95" id="btn-reload-models" title="Vuelve a cargar los modelos en memoria">
          <img src="{{ url_for('static', filename='icons/refresh.svg') }}" alt="Recargar modelos" class="w-3.5 h-3.5 transition-transform" id="icon-reload">
          <span>Volver a cargar modelos</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor central -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-10 md:py-12 space-y-14">
    {% block content %}{% endblock %}
  </main>

  <!-- Pie de página con aviso académico estricto -->
  {% include "components/footer.html" %}

  <!-- Scripts con módulos nativos ES6 -->
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
