<!-- Visor de la muestra facial (5 columnas) -->
<div class="lg:col-span-5 space-y-2.5">
  <div class="relative rounded-xl overflow-hidden bg-surface-container border border-outline-variant/40 aspect-square flex items-center justify-center max-w-sm sm:max-w-none mx-auto w-full">
    <img alt="Muestra facial para análisis" class="w-full h-full object-cover transition-opacity duration-200" id="face-preview" src="{{ url_for('static', filename='img/sample2.jpg') }}">
    <video class="w-full h-full object-cover hidden" id="webcam-video" autoplay playsinline muted></video>

    <!-- Botón circular flotante para voltear cámara en la esquina inferior izquierda -->
    <button id="btn-flip-floating" class="hidden absolute bottom-3 left-3 w-10 h-10 rounded-full bg-surface-container-lowest/90 backdrop-blur-md text-on-surface border border-outline-variant/60 shadow-md active:scale-90 transition-all flex items-center justify-center z-20 hover:bg-surface-container-lowest cursor-pointer" title="Voltear cámara (Frontal / Trasera)" type="button">
      <img src="{{ url_for('static', filename='icons/cameraswitch.svg') }}" alt="Voltear cámara" class="w-5 h-5 shrink-0">
    </button>

    <!-- Indicador de cámara activa -->
    <div class="hidden absolute top-3 right-3 px-2.5 py-1 rounded-full bg-emerald-700/90 text-white text-[11px] font-mono-tag flex items-center gap-1.5 shadow-sm" id="live-indicator">
      <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
      <span>Transmisión activa</span>
    </div>
  </div>

  <div class="flex items-center justify-between text-[11px] sm:text-xs font-mono-tag text-on-surface-variant px-0.5 gap-2">
    <span id="label-ground-truth" class="truncate">Referencia: Masculino - 1 año</span>
    <span class="text-on-surface-variant font-mono-tag shrink-0" id="preview-dimensions">200×200 px</span>
  </div>
</div>
