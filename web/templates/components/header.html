<!-- Barra de navegación superior -->
<header class="border-b border-outline-variant/60 bg-surface/90 backdrop-blur-md sticky top-0 z-30">
  <div
    class="app-container w-full max-w-[1200px] mx-auto px-4 sm:px-6 py-3 sm:py-3.5 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5 sm:gap-3.5">
      <div
        class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-primary/10 flex items-center justify-center border border-primary/20 shrink-0">
        <img src="{{ url_for('static', filename='icons/psychology.svg') }}" alt="Cerebro neuronal"
          class="w-4 h-4 sm:w-5 sm:h-5">
      </div>
      <div>
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="text-sm sm:text-base font-semibold tracking-tight text-on-surface whitespace-nowrap">Face gender
            classification</span>
          <span
            class="hidden sm:inline-flex text-[10px] font-mono-tag px-1.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant whitespace-nowrap shrink-0">UCV
            - 2026</span>
        </div>
        <p class="text-[11px] sm:text-xs text-on-surface-variant font-normal leading-tight mt-0.5">Proyecto de
          investigación</p>
      </div>
    </div>

    <!-- Estado de carga y botón para recargar modelo desde Hugging Face -->
    <div class="flex items-center gap-2 shrink-0">
      <div
        class="hidden lg:flex h-8 items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container-low border border-outline-variant/50 text-xs font-mono-tag text-on-surface-variant"
        id="model-status-indicator">
        <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse shrink-0"></span>
        <span id="status-text">Modelo ViT en memoria</span>
      </div>
      <button
        class="h-8 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium bg-surface-container-low hover:bg-surface-container border border-outline-variant/70 text-on-surface transition-all flex items-center justify-center gap-1.5 active:scale-95 shrink-0"
        id="btn-reload-models" title="Vuelve a cargar el modelo desde Hugging Face Hub">
        <img src="{{ url_for('static', filename='icons/refresh.svg') }}" alt="Recargar modelo"
          class="w-3.5 h-3.5 transition-transform shrink-0" id="icon-reload">
        <span>Recargar</span>
      </button>
    </div>
  </div>
</header>
